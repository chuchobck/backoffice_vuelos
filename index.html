<!doctype html>
<html lang="es-EC">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backoffice de Vuelos</title>
<link rel="icon" href="data:,">
<meta name="description" content="Sistema de administración del módulo de vuelos del Booking Prototipo.">
<style>
:root{
  --primary:#1F3864; --primary-dark:#142544; --primary-soft:#e8edf6;
  --text:#1b1f24; --muted:#4a5568; --border:#c3ccd9; --bg:#f3f5f9; --surface:#fff;
  --error:#a4161a; --error-bg:#fdecec; --ok:#14632d; --ok-bg:#e6f4ea;
  --warn-bg:#fff4d6; --warn:#5c3d00; --focus:#0b57d0; --focus-dark:#ffd54a;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:16px;line-height:1.5;color:var(--text);background:var(--bg);overflow-x:hidden}
h1{font-size:1.5rem;margin:0 0 .25rem;color:var(--primary);line-height:1.25}
h2{font-size:1.15rem;margin:1.25rem 0 .5rem;color:var(--primary)}
h3{font-size:1rem;margin:1rem 0 .4rem}
p{margin:.25rem 0 .75rem}
a{color:var(--primary);text-decoration:underline}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sidebar :focus-visible,.topbar :focus-visible,.login-card .btn-primary:focus-visible{outline-color:var(--focus-dark)}
.skip{position:absolute;left:-999px;top:0;background:#fff;color:var(--primary);padding:.75rem 1rem;z-index:100;font-weight:600}
.skip:focus{left:8px;top:8px}
.linklist{padding-left:1.2rem}
.linklist a{display:inline-flex;align-items:center;min-height:44px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Botones: objetivos de al menos 44 px */
.btn{font:inherit;min-height:44px;min-width:44px;padding:.55rem 1rem;border-radius:6px;border:1px solid var(--primary);background:#fff;color:var(--primary);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;text-decoration:none}
.btn:hover{background:var(--primary-soft)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{border-color:var(--error);color:var(--error)}
.btn-danger:hover{background:var(--error-bg)}
.btn-danger.solid{background:var(--error);color:#fff}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.btn-sm{padding:.4rem .7rem}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}

/* Formularios */
.field{margin:0 0 1rem;min-width:0}
.field label,.field .lbl{display:block;font-weight:600;margin-bottom:.25rem}
.field .req{color:var(--error)}
.field .hint{display:block;color:var(--muted);font-size:.875rem;margin-top:.2rem}
input[type=text],input[type=search],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select{
  font:inherit;width:100%;min-height:44px;padding:.5rem .65rem;border:1px solid #6b7686;border-radius:6px;background:#fff;color:var(--text)}
input[type=checkbox],input[type=radio]{width:24px;height:24px;margin:0;flex:none;accent-color:var(--primary)}
.check{display:flex;align-items:center;gap:.6rem;min-height:44px}
.check label{margin:0;font-weight:500}
[aria-invalid="true"]{border-color:var(--error)!important;border-width:2px!important}
.err{color:var(--error);font-size:.9rem;margin:.25rem 0 0;min-height:0}
.err:empty{display:none}
.alert{padding:.75rem 1rem;border-radius:6px;border:1px solid;margin:0 0 1rem}
.alert-error{background:var(--error-bg);border-color:var(--error);color:#7a1013}
.alert-ok{background:var(--ok-bg);border-color:var(--ok);color:#0d4a20}
.alert-warn{background:var(--warn-bg);border-color:#b7791f;color:var(--warn)}
.alert-info{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-dark)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:0 1rem}
fieldset{border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem 0;margin:0 0 1rem;min-width:0}
legend{font-weight:700;padding:0 .4rem;color:var(--primary)}

/* Layout del panel */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--primary);color:#fff;display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between;padding:.5rem 1rem}
.topbar .brand{font-weight:700;font-size:1.1rem}
.topbar .who{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;font-size:.9rem;min-width:0}
.topbar .who span{overflow-wrap:anywhere}
.topbar .btn{background:transparent;color:#fff;border-color:#fff}
.topbar .btn:hover{background:var(--primary-dark)}
.demo-badge{background:#ffd54a;color:#3a2a00;font-weight:700;padding:.2rem .6rem;border-radius:999px;font-size:.85rem}
.demo-banner{background:var(--warn-bg);color:var(--warn);border-bottom:2px solid #b7791f;padding:.5rem 1rem;font-size:.95rem}
.shell{display:flex;flex:1;min-height:0}
.sidebar{background:var(--primary-dark);color:#fff;width:240px;flex:none;padding:.5rem 0}
.sidebar ul{list-style:none;margin:0;padding:0}
.sidebar .grp{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:#c9d4ea;padding:.75rem 1rem .25rem}
.sidebar a{display:flex;align-items:center;min-height:44px;padding:.4rem 1rem;color:#fff;text-decoration:none;border-left:4px solid transparent}
.sidebar a:hover{background:var(--primary)}
.sidebar a[aria-current="page"]{background:var(--primary);border-left-color:var(--focus-dark);font-weight:700}
.sidebar .tag{margin-left:auto;font-size:.7rem;background:#ffd54a;color:#3a2a00;border-radius:4px;padding:0 .35rem}
main{flex:1;min-width:0;padding:1.25rem 1rem 3rem;max-width:1200px;width:100%}
main:focus{outline:none}
h1:focus{outline:none}
.page-head{display:flex;flex-wrap:wrap;gap:.5rem 1rem;justify-content:space-between;align-items:flex-start;margin-bottom:1rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;margin-bottom:1rem}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:.75rem}
.stat{background:#fff;border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;text-decoration:none;color:inherit;display:block}
.stat:hover{border-color:var(--primary)}
.stat b{display:block;font-size:1.8rem;color:var(--primary);line-height:1.2}
.stat span{color:var(--muted);font-size:.95rem}

/* Tablas */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:#fff;max-width:100%}
table{border-collapse:collapse;width:100%;min-width:560px}
caption{text-align:left;padding:.5rem .75rem;color:var(--muted);font-size:.9rem}
th,td{text-align:left;padding:.55rem .75rem;border-bottom:1px solid #e1e6ee;vertical-align:middle}
th{background:var(--primary-soft);color:var(--primary-dark);font-size:.9rem;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.inactive td{color:var(--muted);background:#f7f7f9}
.badge{display:inline-block;padding:.05rem .5rem;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--ok-bg);color:var(--ok)}
.badge.off{background:#eceef2;color:#3d4654}
.toolbar{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:flex-end;margin-bottom:.75rem}
.toolbar .field{margin:0;flex:1 1 180px}
.pager{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;margin-top:.75rem}

/* Asistente */
.steps{list-style:none;display:flex;flex-wrap:wrap;gap:.4rem;padding:0;margin:0 0 1rem;counter-reset:s}
.steps li{flex:1 1 130px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:.45rem .6rem;font-size:.9rem;display:flex;gap:.5rem;align-items:center;min-height:44px}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:#e1e6ee;color:var(--text);display:grid;place-items:center;font-weight:700}
.steps li[aria-current="step"]{border-color:var(--primary);background:var(--primary-soft);font-weight:700}
.steps li[aria-current="step"]::before{background:var(--primary);color:#fff}
.steps li.done::before{content:"✓";background:var(--ok);color:#fff}
.dl{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:.25rem 1rem;margin:0}
.dl dt{font-weight:600;color:var(--muted)}
.dl dd{margin:0;overflow-wrap:anywhere}
.progress-list{list-style:none;padding:0;margin:0}
.progress-list li{padding:.35rem 0;border-bottom:1px solid #e1e6ee;overflow-wrap:anywhere}
.pending{border:2px dashed #b7791f;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:1rem}

/* Diálogo */
dialog{border:0;border-radius:10px;padding:0;max-width:min(560px,calc(100vw - 24px));width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,40,.55)}
.dlg-body{padding:1rem 1.25rem 1.25rem;max-height:85vh;overflow:auto}
.dlg-body h2{margin-top:0}
.toastbox{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:200;max-width:calc(100vw - 24px)}
.toast{background:var(--primary-dark);color:#fff;padding:.7rem 1rem;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.3)}

/* Login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(160deg,var(--primary) 0 38%,var(--bg) 38%)}
.login-card{background:#fff;border-radius:12px;max-width:420px;width:100%;padding:1.5rem;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.login-card h1{font-size:1.4rem}

@media (max-width:760px){
  .shell{flex-direction:column}
  .sidebar{width:100%;padding:0}
  .sidebar ul{display:flex;overflow-x:auto;white-space:nowrap}
  .sidebar .grp{display:none}
  .sidebar a{border-left:0;border-bottom:4px solid transparent}
  .sidebar a[aria-current="page"]{border-bottom-color:var(--focus-dark)}
  .dl{grid-template-columns:1fr}
  .dl dt{margin-top:.4rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<a class="skip" href="#contenido">Saltar al contenido</a>
<div id="root"></div>
<div class="toastbox" id="toastbox" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script>
"use strict";
/* ==========================================================================
   Backoffice de Vuelos — un solo archivo, JavaScript vanilla, sin build.
   Todo texto que viene de la API se inserta con textContent (nunca innerHTML).
   ========================================================================== */

/* ---------- Utilidades de DOM ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  let value;
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "value") value = v;
    else if (k === "checked") e.checked = !!v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : String(v));
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  if (value !== undefined) e.value = value;
  return e;
}
const $ = (s, r = document) => r.querySelector(s);
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
let uidN = 0;
const nextId = (p = "id") => `${p}-${++uidN}`;
function toast(msg) {
  const box = $("#toastbox");
  const t = h("div", { class: "toast", text: msg });
  box.append(t);
  setTimeout(() => t.remove(), 4500);
}

/* ---------- Fechas: la API usa UTC; el panel muestra hora de Ecuador (UTC−5, sin horario de verano) ---------- */
const EC_TZ = "America/Guayaquil";
function fmtEC(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  return new Intl.DateTimeFormat("es-EC", { timeZone: EC_TZ, dateStyle: "medium", timeStyle: "short" }).format(d);
}
function fmtDateEC(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return isNaN(d) ? "—" : new Intl.DateTimeFormat("es-EC", { timeZone: EC_TZ, dateStyle: "medium" }).format(d);
}
/** "2026-11-02" + "13:05" (hora de Ecuador) → "2026-11-02T18:05:00Z" */
function ecToUtcIso(dateStr, timeStr, addDays = 0) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const [hh, mm] = timeStr.split(":").map(Number);
  const t = Date.UTC(y, m - 1, d, hh + 5, mm) + addDays * 86400000;
  return new Date(t).toISOString().replace(".000Z", "Z");
}
/** ISO UTC → "YYYY-MM-DDTHH:MM" en hora de Ecuador, para <input type=datetime-local>. */
function utcIsoToEcInput(iso) {
  if (!iso) return "";
  return new Date(new Date(iso).getTime() - 5 * 3600000).toISOString().slice(0, 16);
}
function ecInputToUtcIso(v) { return ecToUtcIso(v.slice(0, 10), v.slice(11, 16)); }
function todayEC() { return new Date(Date.now() - 5 * 3600000).toISOString().slice(0, 10); }

/* ---------- Errores de la API (ProblemDetails) ---------- */
class ApiError extends Error {
  constructor(status, body = {}, retryAfter = null) {
    super(`HTTP ${status}`);
    this.status = status;
    this.code = body.code || null;
    this.detail = body.detail || "";
    this.invalidParams = Array.isArray(body.invalidParams) ? body.invalidParams : [];
    this.retryAfter = retryAfter;
  }
}
const PARAM_LABELS = {
  code: "Código", name: "Nombre", iso3: "ISO3", country: "País", cityId: "Ciudad", timeZone: "Zona horaria",
  ticketPrefix: "Prefijo de boleto", airline: "Aerolínea", cabinClass: "Cabina", changeable: "Cambiable",
  cancellationPenaltyPercent: "Penalización", marketingCarrier: "Aerolínea comercial", number: "Número",
  operatingCarrier: "Aerolínea operadora", origin: "Origen", destination: "Destino", flightNumber: "Número de vuelo",
  seatMapId: "Mapa de asientos", scheduledDeparture: "Salida", scheduledArrival: "Llegada", departureTerminal: "Terminal de salida",
  arrivalTerminal: "Terminal de llegada", cabins: "Cabinas", departureId: "Salida", fareFamilyId: "Familia tarifaria",
  currency: "Moneda", extraBagPrice: "Maleta extra", changeFee: "Cargo por cambio", prices: "Precios", status: "Estado",
  email: "Correo", password: "Contraseña", limit: "Límite", cursor: "Cursor", aircraftModel: "Equipo",
};
// Mensajes técnicos conocidos del backend (en inglés) → español claro. Si no coincide, se usa un mensaje genérico.
const DETAIL_ES = [
  [/departure must be in the future/i, "La salida debe ser en el futuro."],
  [/must be after scheduledDeparture/i, "La llegada debe ser posterior a la salida."],
  [/must be different from origin/i, "El destino debe ser distinto del origen."],
  [/does not exist or is inactive/i, "Una de las referencias no existe o está inactiva."],
  [/seat map belongs to airline/i, "El mapa de asientos no pertenece a la aerolínea que opera el vuelo."],
  [/seat map has no .* cabin/i, "El mapa de asientos no tiene esa cabina."],
  [/quota cannot exceed/i, "El cupo no puede superar los asientos físicos de la cabina."],
  [/fare family belongs to airline/i, "La familia tarifaria es de otra aerolínea."],
  [/has no .* cabin/i, "La salida no tiene la cabina de esa familia tarifaria."],
  [/must include the ADULT price/i, "Falta el precio de adulto."],
  [/already been used|already exists|duplicate/i, "Ya existe un registro con esos datos."],
  [/no longer on sale/i, "La salida ya no está a la venta."],
  [/already departed/i, "El vuelo ya despegó."],
  [/scheduled in the past/i, "La salida está en el pasado."],
];
function friendly(e, ctx = {}) {
  if (!(e instanceof ApiError)) return "Ocurrió un error inesperado. Inténtalo de nuevo.";
  const fields = e.invalidParams.map((p) => PARAM_LABELS[String(p.name).split(/[.\[]/)[0]] || String(p.name)).filter((v, i, a) => a.indexOf(v) === i);
  const extra = fields.length ? ` Revisa: ${fields.join(", ")}.` : "";
  const known = DETAIL_ES.find(([re]) => re.test(e.detail));
  switch (e.status) {
    case 0: return "No se pudo conectar con la API. Revisa tu conexión o prueba el modo demo.";
    case 400: return `Los datos enviados no son válidos.${extra}`;
    case 401: return (ctx.login || e._login) ? "Correo o contraseña incorrectos." : "Tu sesión no es válida o expiró. Inicia sesión de nuevo.";
    case 403: return "Tu cuenta no tiene permiso de administrador para realizar esta acción.";
    case 404: return "No se encontró el registro. Puede que ya no exista.";
    case 409: return known ? known[1] : "La operación choca con el estado actual: el registro ya existe o lo usan otros registros activos.";
    case 413: case 415: return "La solicitud no tiene un formato aceptado.";
    case 422: return (known ? known[1] : "Los datos no cumplen las reglas del negocio: una referencia no existe, está inactiva o el horario no es válido.") + extra;
    case 429: return `Demasiadas solicitudes.${e.retryAfter ? ` Espera ${e.retryAfter} s e inténtalo de nuevo.` : " Espera un momento e inténtalo de nuevo."}`;
    default: return e.status >= 500 ? "La API tuvo un problema. Inténtalo más tarde." : "No se pudo completar la operación.";
  }
}

/* ---------- Sesión y cliente HTTP ---------- */
const CFG = window.APP_CONFIG || {};
const API_URL = String(CFG.API_URL || "").replace(/\/+$/, "");
const RT_KEY = "bo_vuelos_refresh";
const session = { access: null, refresh: null, demo: false, user: null };
let refreshing = null;
let onSessionLost = () => {};

function saveRefresh(rt) { try { rt ? sessionStorage.setItem(RT_KEY, rt) : sessionStorage.removeItem(RT_KEY); } catch (_) {} }
function loadRefresh() { try { return sessionStorage.getItem(RT_KEY); } catch (_) { return null; } }
function setTokens(r) {
  session.access = r.access_token;
  session.refresh = r.refresh_token;
  saveRefresh(r.refresh_token);
}

async function rawFetch(method, path, { body, query, token } = {}) {
  const url = new URL(API_URL + path);
  for (const [k, v] of Object.entries(query || {})) if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, v);
  const headers = { Accept: "application/json, application/problem+json" };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  if (token) headers.Authorization = `Bearer ${token}`;
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 30000);
  let res;
  try {
    res = await fetch(url, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined, signal: ctl.signal, cache: "no-store" });
  } catch (_) {
    throw new ApiError(0);
  } finally { clearTimeout(timer); }
  if (res.status === 204) return null;
  let data = null;
  try { data = await res.json(); } catch (_) { data = null; }
  if (!res.ok) throw new ApiError(res.status, data || {}, res.headers.get("Retry-After"));
  return data;
}

/** Renueva el token UNA sola vez a la vez: el refresh token rota y reusar uno viejo revoca la sesión. */
function doRefresh() {
  if (refreshing) return refreshing;
  refreshing = (async () => {
    if (!session.refresh) throw new ApiError(401);
    setTokens(await rawFetch("POST", "/auth/refresh", { body: { refresh_token: session.refresh } }));
  })().finally(() => { refreshing = null; });
  return refreshing;
}

async function api(method, path, opts = {}) {
  if (session.demo) return demoRequest(method, path, opts);
  try {
    return await rawFetch(method, path, { ...opts, token: session.access });
  } catch (e) {
    if (!(e instanceof ApiError) || e.status !== 401) throw e;
  }
  try { await doRefresh(); } catch (_) { endSession("Tu sesión expiró. Inicia sesión de nuevo."); throw new ApiError(401); }
  try {
    return await rawFetch(method, path, { ...opts, token: session.access });
  } catch (e) {
    if (e instanceof ApiError && e.status === 401) endSession("Tu sesión expiró. Inicia sesión de nuevo.");
    throw e;
  }
}
function endSession(msg) {
  session.access = null; session.refresh = null; session.user = null; session.demo = false;
  saveRefresh(null);
  onSessionLost(msg);
}

/** Recorre todas las páginas de una lista (cursor) hasta un máximo razonable. */
async function loadAll(path, query = {}, maxPages = 12) {
  const out = [];
  let cursor;
  for (let i = 0; i < maxPages; i++) {
    const page = await api("GET", path, { query: { ...query, limit: 50, cursor } });
    out.push(...page.items);
    if (!page.nextCursor) break;
    cursor = page.nextCursor;
  }
  return out;
}
const catalogCache = {};
function cached(key, loader) {
  if (!catalogCache[key]) catalogCache[key] = loader().catch((e) => { delete catalogCache[key]; throw e; });
  return catalogCache[key];
}
function invalidateCache() { for (const k of Object.keys(catalogCache)) delete catalogCache[k]; }

/* ---------- Componentes: campos, formularios, diálogos ---------- */
const REQ_MSG = "Este campo es obligatorio.";
/**
 * spec: {name,label,type(text|number|select|checkbox|date|time|datetime),required,max,min,maxVal,pattern,msg,
 *        hint,upper,options:[{value,label}],custom(value,all)=>msg,placeholder,readonly,step}
 */
function mkField(spec, initial) {
  const id = nextId("f");
  const errId = id + "-e", hintId = id + "-h";
  let input;
  const t = spec.type || "text";
  if (t === "select") {
    input = h("select", { id, name: spec.name }, (spec.options || []).map((o) => h("option", { value: o.value, text: o.label })));
  } else if (t === "checkbox") {
    input = h("input", { id, name: spec.name, type: "checkbox" });
  } else {
    const typ = { text: "text", number: "text", date: "date", time: "time", datetime: "datetime-local", email: "email", password: "password" }[t] || "text";
    input = h("input", {

      seat.setOptions(optList(maps, (m) => m.id, (m) => `${m.name} — ${m.cabins.map((c) => `${CABIN_ES[c.cabinClass] || c.cabinClass} ${c.seats}`).join(" / ")}`), false);
      if (maps.some((m) => m.id === W.seatMapId)) seat.set(W.seatMapId);
      else if (maps.length === 1) seat.set(maps[0].id);
      if (!maps.length) seatNote.append(alertBox("warn", "No hay un mapa de asientos activo para esa aerolínea y ese equipo. La creación de mapas todavía no está en este panel (se hace por la API)."));
    } catch (e) { seat.setOptions([{ value: "", label: "No se pudo cargar" }], false); seatNote.append(alertBox("error", friendly(e))); }
  };
  airline.input.addEventListener("change", () => { W.seatMapId = ""; loadSeatMaps(); loadFlights(); });
  model.input.addEventListener("change", () => { W.seatMapId = ""; loadSeatMaps(); });

  // Número de vuelo: existente (misma aerolínea y ruta) o nuevo
  const flightBox = h("fieldset", {}, h("legend", { text: "Número de vuelo" }));
  const modeNew = h("input", { type: "radio", name: "fmode", id: "fm-new", value: "new" });
  const modeEx = h("input", { type: "radio", name: "fmode", id: "fm-ex", value: "existing" });
  const exSel = mkField({ name: "existingFlight", label: "Vuelo existente de esta ruta", type: "select", required: true, options: [{ value: "", label: "—" }] }, W.existingFlight);
  const num = mkField({ name: "number", label: "Número nuevo (1 a 4 dígitos)", type: "number", required: true, max: 4, pattern: /^[1-9][0-9]{0,3}$/,
    msg: "Escribe de 1 a 4 dígitos, sin ceros a la izquierda (ej. 1500).", hint: "Se une al código de la aerolínea: AV + 1500 = AV1500." }, W.number);
  const exWrap = h("div", { style: "margin-left:2rem" }, exSel.el);
  const newWrap = h("div", { style: "margin-left:2rem" }, num.el);
  flightBox.append(h("div", { class: "check" }, modeNew, h("label", { for: "fm-new", text: "Crear un número de vuelo nuevo para esta ruta" })), newWrap,
    h("div", { class: "check" }, modeEx, h("label", { for: "fm-ex", text: "Usar un vuelo que ya existe en esta ruta" })), exWrap);
  box.append(flightBox);
  const applyMode = () => {
    const ex = modeEx.checked;
    exWrap.style.display = ex ? "" : "none"; newWrap.style.display = ex ? "none" : "";
  };
  modeNew.checked = W.flightMode !== "existing"; modeEx.checked = W.flightMode === "existing";
  modeNew.addEventListener("change", applyMode); modeEx.addEventListener("change", applyMode);
  applyMode();
  const loadFlights = async () => {
    if (!airline.get()) return;
    try {
      const fl = await loadAll("/admin/flights", { airline: airline.get(), origin: W.origin, destination: W.destination });
      W.flightsFound = fl;
      exSel.setOptions(optList(fl, (f) => f.flightNumber, (f) => `${f.flightNumber} (${f.origin} → ${f.destination})`, fl.length ? "Selecciona…" : "No hay vuelos en esta ruta"), false);
      if (fl.some((f) => f.flightNumber === W.existingFlight)) exSel.set(W.existingFlight);
      if (!fl.length) { modeNew.checked = true; modeEx.checked = false; modeEx.disabled = true; applyMode(); } else modeEx.disabled = false;
    } catch (e) { box.append(alertBox("error", friendly(e))); }
  };
  await Promise.all([loadSeatMaps(), loadFlights()]);

  return {
    async validate() {
      const useEx = modeEx.checked;
      const list = [airline, model, seat, useEx ? exSel : num];
      if (!validateFields(list)) return false;
      if (!useEx) {
        const fn = airline.get() + num.get();
        try {
          const f = await api("GET", `/admin/flights/${fn}`);
          num.showError(`El vuelo ${fn} ya existe${f.active ? "" : " (dado de baja)"} con la ruta ${f.origin} → ${f.destination}. Usa "un vuelo que ya existe" o elige otro número.`);
          num.input.focus(); return false;
        } catch (e) {
          if (!(e instanceof ApiError && e.status === 404)) { box.prepend(alertBox("error", friendly(e))); return false; }
        }
      }
      return true;
    },
    collect() {
      W.airline = airline.get(); W.model = model.get(); W.seatMapId = seat.get();
      W.flightMode = modeEx.checked ? "existing" : "new"; W.existingFlight = exSel.get(); W.number = num.get();
    },
  };
}

/* ----- Paso 3: Horario ----- */
async function stepSchedule(box) {
  box.append(h("p", { text: "Define el horario en hora de Ecuador. Para repetir el vuelo varios días, indica una fecha final y los días de la semana." }));
  const startDate = mkField({ name: "startDate", label: "Primera fecha de salida", type: "date", required: true,
    custom: (v) => (v < todayEC() ? "La fecha no puede estar en el pasado." : "") }, W.startDate);
  const endDate = mkField({ name: "endDate", label: "Repetir hasta (opcional)", type: "date", hint: "Déjalo vacío para crear una sola salida.",
    custom: (v, all) => (all.startDate && v < all.startDate ? "Debe ser igual o posterior a la primera fecha." : "") }, W.endDate);
  const depTime = mkField({ name: "depTime", label: "Hora de salida", type: "time", required: true }, W.depTime);
  const arrTime = mkField({ name: "arrTime", label: "Hora de llegada", type: "time", required: true,
    custom: (v, all) => (all.arrPlus === "0" && all.depTime && v <= all.depTime ? "La llegada debe ser posterior a la salida. Si llega al día siguiente, elige \"+1 día\"." : "") }, W.arrTime);
  const arrPlus = mkField({ name: "arrPlus", label: "Día de llegada", type: "select", options: [{ value: "0", label: "Mismo día" }, { value: "1", label: "+1 día" }, { value: "2", label: "+2 días" }] }, W.arrPlus);
  const depT = mkField({ name: "depTerminal", label: "Terminal de salida (opcional)", max: 10 }, W.depTerminal);
  const arrT = mkField({ name: "arrTerminal", label: "Terminal de llegada (opcional)", max: 10 }, W.arrTerminal);
  const fs = { startDate, endDate, depTime, arrTime, arrPlus, depTerminal: depT, arrTerminal: arrT };
  const all = () => Object.fromEntries(Object.entries(fs).map(([k, f]) => [k, f.get()]));
  Object.values(fs).forEach((f) => (f.all = all));
  startDate.input.min = todayEC();

  const daysBox = h("fieldset", {}, h("legend", { text: "Días de la semana en que opera" }));
  const dayInputs = DAY_NAMES.map((n, i) => {
    const c = h("input", { type: "checkbox", id: `day-${i}`, checked: W.days[i] });
    daysBox.append(h("div", { class: "check", style: "display:inline-flex;margin-right:1rem" }, c, h("label", { for: `day-${i}`, text: n })));
    return c;
  });
  const preview = h("div", { class: "alert alert-info", role: "status", "aria-live": "polite" });
  box.append(h("div", { class: "grid2" }, startDate.el, endDate.el), daysBox, h("div", { class: "grid2" }, depTime.el, arrTime.el, arrPlus.el), h("div", { class: "grid2" }, depT.el, arrT.el), preview);
  const syncDays = () => { daysBox.style.display = endDate.get() ? "" : "none"; };
  const updatePreview = () => {
    const snap = () => { W.startDate = startDate.get(); W.endDate = endDate.get(); W.days = dayInputs.map((c) => c.checked); };
    snap(); syncDays();
    const ds = wizardDates();
    if (!ds.length) { preview.textContent = "Elige la fecha y la hora para ver cuántas salidas se crearán."; return; }
    const t = depTime.get() && arrTime.get() ? ` · salida ${depTime.get()} → llegada ${arrTime.get()}${arrPlus.get() !== "0" ? " (+" + arrPlus.get() + ")" : ""}` : "";
    preview.textContent = `Se crearán ${ds.length} salida${ds.length === 1 ? "" : "s"}: ${ds.length > 6 ? ds.slice(0, 3).join(", ") + " … " + ds.slice(-1) : ds.join(", ")}${t} (hora de Ecuador).`;
  };
  [startDate, endDate, depTime, arrTime, arrPlus].forEach((f) => f.input.addEventListener("input", updatePreview));
  [startDate, endDate, depTime, arrTime, arrPlus].forEach((f) => f.input.addEventListener("change", updatePreview));
  dayInputs.forEach((c) => c.addEventListener("change", updatePreview));
  updatePreview();

  return {
    validate() {
      if (!validateFields(Object.values(fs), all())) return false;
      W.startDate = startDate.get(); W.endDate = endDate.get(); W.days = dayInputs.map((c) => c.checked);
      const ds = wizardDates();
      if (!ds.length) { daysBox.prepend(alertBox("error", "Ningún día de la semana coincide con el rango. Marca al menos un día válido.")); return false; }
      if (ds.length > 31) { endDate.showError("Máximo 31 salidas por vez. Acorta el rango."); endDate.input.focus(); return false; }
      const first = ecToUtcIso(ds[0], depTime.get());
      if (new Date(first) <= new Date()) { depTime.showError("La primera salida debe ser en el futuro."); depTime.input.focus(); return false; }
      return true;
    },
    collect() {
      W.startDate = startDate.get(); W.endDate = endDate.get(); W.days = dayInputs.map((c) => c.checked);
      W.depTime = depTime.get(); W.arrTime = arrTime.get(); W.arrPlus = arrPlus.get(); W.depTerminal = depT.get(); W.arrTerminal = arrT.get();
    },
  };
}

/* ----- Paso 4: Cabinas, inventario y familias tarifarias ----- */

    if (!cabFams.length) inner.append(alertBox("warn", "No hay familias tarifarias activas para esta cabina en esta aerolínea. Créalas en Catálogo → Familias tarifarias; sin ellas la cabina no tendrá precio."));
    for (const fam of cabFams) {

      const fon = h("input", { type: "checkbox", id: nextId("fam"), checked: !!sv.on });
      const money = (name, label, req, val) => mkField({ name, label, required: req, pattern: MONEY_RE, msg: MONEY_MSG, max: 13, inputmode: "decimal" }, val);
      const f = {
        fam, on: fon,

      };
      // Niño e infante: ambos montos o ninguno
      f.childT.spec.custom = (v) => (f.childB.get() && !v ? "Falta el monto de impuestos." : "");

      f.infT.spec.custom = (v) => (f.infB.get() && !v ? "Falta el monto de impuestos." : "");

/* ----- Paso 5: Revisión y confirmación ----- */
function wizardPlan() {
  const flightNumber = W.flightMode === "existing" ? W.existingFlight : W.airline + W.number;
  const dates = wizardDates();
  const cabins = Object.entries(W.cabins).filter(([, c]) => c.on).map(([cabinClass, c]) => ({ cabinClass, totalSeats: Number(c.seats) }));
  const fares = [];
  for (const [cabinClass, c] of Object.entries(W.cabins)) {
    if (!c.on) continue;
    for (const [fareFamilyId, f] of Object.entries(c.fams)) {
      if (!f.on) continue;
      const prices = [{ passengerType: "ADULT", baseFare: f.adultB, taxes: f.adultT }];
      if (f.childB && f.childT) prices.push({ passengerType: "CHILD", baseFare: f.childB, taxes: f.childT });
      if (f.infB && f.infT) prices.push({ passengerType: "INFANT", baseFare: f.infB, taxes: f.infT });
      const body = { fareFamilyId, currency: W.currency, extraBagPrice: f.bag, prices };
      if (f.fee) body.changeFee = f.fee;
      fares.push({ cabinClass, name: f.name, code: f.code, body });
    }
  }
  const departures = dates.map((d) => {
    const body = {
      flightNumber, seatMapId: W.seatMapId,
      scheduledDeparture: ecToUtcIso(d, W.depTime), scheduledArrival: ecToUtcIso(d, W.arrTime, Number(W.arrPlus)), cabins,
    };
    if (W.depTerminal) body.departureTerminal = W.depTerminal;
    if (W.arrTerminal) body.arrivalTerminal = W.arrTerminal;
    return { date: d, body };
  });
  return { flightNumber, departures, fares, cabins };
}

async function withRetry429(fn, say) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) {
      if (!(e instanceof ApiError) || e.status !== 429 || i >= 3) throw e;
      const wait = Math.min(Math.max(parseInt(e.retryAfter, 10) || 5, 1), 65);
      say(`Límite de solicitudes: esperando ${wait} s para continuar…`);
      await new Promise((r) => setTimeout(r, wait * 1000));
    }
  }
}

async function executePlan(plan, say) {
  const R = (W.result = W.result || { flightCreated: false, deps: [], done: false, flightNumber: plan.flightNumber });
  const call = async (label, method, path, body) => {
    try { return await withRetry429(() => api(method, path, { body }), say); }
    catch (e) { if (e instanceof ApiError) e.stepLabel = label; throw e; }
  };
  if (W.flightMode === "new" && !R.flightCreated) {
    say(`Creando el vuelo ${plan.flightNumber}…`);
    await call(`Vuelo ${plan.flightNumber}`, "POST", "/admin/flights", { marketingCarrier: W.airline, number: W.number, origin: W.origin, destination: W.destination });
    R.flightCreated = true;
    invalidateCache();
    say(`✔ Vuelo ${plan.flightNumber} creado.`);
  }
  for (let i = 0; i < plan.departures.length; i++) {
    const d = plan.departures[i];
    R.deps[i] = R.deps[i] || { date: d.date, id: null, fares: {} };
    const slot = R.deps[i];
    if (!slot.id) {
      say(`Creando la salida del ${d.date}…`);
      const dep = await call(`Salida del ${d.date}`, "POST", "/admin/departures", d.body);
      slot.id = dep.id;
      say(`✔ Salida ${d.date} creada (${dep.id}).`);
    }
    for (const f of plan.fares) {
      if (slot.fares[f.body.fareFamilyId]) continue;
      say(`Creando tarifa ${f.code} para ${d.date}…`);
      const fare = await call(`Tarifa ${f.code} del ${d.date}`, "POST", "/admin/fares", { departureId: slot.id, ...f.body });
      slot.fares[f.body.fareFamilyId] = fare.id;
    }
    say(`✔ ${plan.fares.length} tarifa(s) listas para ${d.date}.`);
  }
}

/** Valor inicial de un campo del formulario a partir del registro. */
function initialFor(s, row) {
  if (!row) return s.default;
  const v = row[s.name];
  if (s.type === "datetime") return utcIsoToEcInput(v);
  if (s.type === "checkbox") return !!v;
  return v == null ? "" : String(v);
}
/** Cuerpo de la petición: al crear, todo lo escrito; al editar, solo lo que cambió (PATCH parcial). */
function bodyFrom(specs, vals, row) {
  const body = {};
  for (const s of specs) {
    let v = vals[s.name];
    if (row) {
      if (s.scope === "create") continue;
      if (String(initialFor(s, row)) === String(v)) continue;
    } else if (s.scope === "edit") continue;
    if (s.type === "checkbox") v = !!v;
    else if (v === "" || v == null) { if (row && s.nullable) v = null; else if (row && s.type === "select" && s.name === "operatingCarrier") continue; else continue; }
    else if (s.type === "number") v = Number(v);
    else if (s.type === "datetime") v = ecInputToUtcIso(v);
    body[s.name] = v;
  }
  return body;
}

routes.lista = (main, entId, params) => {
  const cfg = ENT[entId];
  if (!cfg) { main.append(pageHead("No encontrado"), alertBox("error", "Esa pantalla no existe.")); return; }
  const L = { cursors: [undefined], page: 0, items: [], next: null, filters: {}, inactive: false, limit: 10, q: "" };
  if (params.flightNumber) L.filters.flightNumber = params.flightNumber;
  const createBtn = cfg.wizard
    ? h("a", { class: "btn btn-primary", href: "#/crear-vuelo", text: "Crear vuelo" })
    : cfg.noCreate ? null : h("button", { class: "btn btn-primary", type: "button", text: `Nuevo ${cfg.one}`, onclick: () => openForm(null) });
  main.append(pageHead(cfg.title, cfg.note || "Búsqueda, paginación y administración. Eliminar es siempre una baja lógica.", createBtn));
  const msg = h("div", { role: "status", "aria-live": "polite" });
  const tableBox = h("div");
  const pager = h("div", { class: "pager" });
  const toolbar = h("form", { class: "toolbar", role: "search", "aria-label": `Buscar en ${cfg.title}`, novalidate: true });
  main.append(msg, toolbar, tableBox, pager);

  const search = mkField({ name: "q", label: "Buscar en esta página", placeholder: "Texto a buscar…", max: 60 }, "");
  search.input.setAttribute("type", "search");
  search.input.addEventListener("input", () => { L.q = search.get().toLowerCase(); draw(); });
  const inact = h("input", { type: "checkbox", id: "f-inact" });
  const limitSel = mkField({ name: "limit", label: "Filas por página", type: "select", options: [10, 25, 50].map((n) => ({ value: String(n), label: String(n) })) }, "10");
  let filterFields = [];

  const load = async () => {
    clear(msg);
    clear(tableBox).append(h("p", { text: "Cargando…" }));
    try {
      const q = { limit: L.limit, cursor: L.cursors[L.page], includeInactive: L.inactive ? "true" : undefined, ...L.filters };
      const page = await api("GET", cfg.path, { query: q });
      L.items = page.items; L.next = page.nextCursor || null;
      draw();
    } catch (e) { clear(tableBox); msg.append(alertBox("error", friendly(e))); clear(pager); }
  };
  const reload = (reset) => { if (reset) { L.cursors = [undefined]; L.page = 0; } return load(); };

  const draw = () => {
    clear(tableBox);
    const shown = L.items.filter((r) => !L.q || JSON.stringify(Object.values(r)).toLowerCase().includes(L.q) || cfg.cols.some(([, v]) => { const x = v(r); return typeof x === "string" && x.toLowerCase().includes(L.q); }));
    if (!shown.length) tableBox.append(h("p", { class: "card", text: L.items.length ? "Ninguna fila de esta página coincide con la búsqueda." : "No hay registros con estos filtros." }));
    else {
      const head = h("tr", {}, cfg.cols.map(([t]) => h("th", { scope: "col", text: t })), h("th", { scope: "col", text: "Acciones" }));
      const body = shown.map((r) => {
        const label = cfg.id(r);
        const acts = h("div", { class: "actions" },
          h("button", { class: "btn btn-sm", type: "button", text: "Editar", "aria-label": `Editar ${cfg.one} ${label}`, onclick: () => openForm(r) }),
          r.active
            ? h("button", { class: "btn btn-sm btn-danger", type: "button", text: cfg.deleteLabel || "Dar de baja", "aria-label": `${cfg.deleteLabel || "Dar de baja"} ${cfg.one} ${label}`, onclick: () => deactivate(r) })
            : h("button", { class: "btn btn-sm", type: "button", text: "Reactivar", "aria-label": `Reactivar ${cfg.one} ${label}`, onclick: () => reactivate(r) }));
        return h("tr", { class: r.active ? "" : "inactive" }, cfg.cols.map(([, v]) => h("td", {}, v(r))), h("td", {}, acts));
      });
      tableBox.append(h("div", { class: "table-wrap", tabindex: "0", role: "region", "aria-label": `Tabla de ${cfg.title}` },
        h("table", {}, h("caption", { text: `${shown.length} de ${L.items.length} fila(s) en esta página · página ${L.page + 1}` }), h("thead", {}, head), h("tbody", {}, body))));
    }
    clear(pager).append(
      h("div", { class: "actions" },
        h("button", { class: "btn", type: "button", text: "← Anterior", disabled: L.page === 0, onclick: () => { L.page--; load(); } }),
        h("button", { class: "btn", type: "button", text: "Siguiente →", disabled: !L.next, onclick: () => { L.cursors[L.page + 1] = L.next; L.page++; load(); } })),
      h("span", { style: "color:var(--muted)", text: `Página ${L.page + 1}${L.next ? "" : " (última)"}` }));
  };

  const deactivate = async (r) => {
    const ok = await confirmDialog(`${cfg.deleteLabel || "Dar de baja"}: ${cfg.id(r)}`,
      "Es una baja lógica: el registro queda inactivo, no se borra, y se puede reactivar después. Si otros registros activos lo usan, la API no lo permitirá.", cfg.deleteLabel || "Dar de baja");
    if (!ok) return;
    try { await api("DELETE", `${cfg.path}/${encodeURIComponent(cfg.id(r))}`); invalidateCache(); toast("Listo: registro dado de baja."); await reload(false); }
    catch (e) { clear(msg).append(alertBox("error", friendly(e))); msg.scrollIntoView({ block: "nearest" }); }
  };
  const reactivate = async (r) => {
    try { await api("POST", `${cfg.path}/${encodeURIComponent(cfg.id(r))}/reactivate`); invalidateCache(); toast("Listo: registro reactivado."); await reload(false); }
    catch (e) { clear(msg).append(alertBox("error", friendly(e))); msg.scrollIntoView({ block: "nearest" }); }
  };
  const openForm = async (row) => {
    let specs;
    try { specs = await cfg.fields(); } catch (e) { clear(msg).append(alertBox("error", friendly(e))); return; }
    specs = specs.filter((s) => (row ? s.scope !== "create" : s.scope !== "edit"));
    const values = {};
    for (const s of specs) values[s.name] = initialFor(s, row);
    let close;
    const form = mkForm(specs, values, {
      submitLabel: row ? "Guardar cambios" : "Crear",
      onCancel: () => close(),
      onSubmit: async (vals) => {
        const body = bodyFrom(specs, vals, row);
        if (row && !Object.keys(body).length) { close(); toast("No hay cambios que guardar."); return; }
        if (row) await api("PATCH", `${cfg.path}/${encodeURIComponent(cfg.id(row))}`, { body });
        else await api("POST", cfg.path, { body });
        invalidateCache(); close(); toast(row ? "Cambios guardados." : "Registro creado."); await reload(!row);
      },
    });
    close = openDialog(row ? `Editar ${cfg.one} ${cfg.id(row)}` : `Nuevo ${cfg.one}`, form.el);
    const first = form.el.querySelector("input,select"); if (first) first.focus();
  };

  // Barra de herramientas: filtros del servidor + búsqueda local + inactivos + tamaño de página
  (async () => {
    try { filterFields = cfg.filters ? (await cfg.filters()).map((s) => mkField(s, L.filters[s.name] || "")) : []; } catch (e) { msg.append(alertBox("error", friendly(e))); }
    const apply = h("button", { class: "btn btn-primary", type: "submit", text: "Aplicar filtros" });
    toolbar.append(search.el, ...filterFields.map((f) => f.el), limitSel.el,
      h("div", { class: "field" }, h("div", { class: "check" }, inact, h("label", { for: "f-inact", text: "Mostrar inactivos" }))), h("div", { class: "field" }, apply));
    toolbar.addEventListener("submit", (ev) => {
      ev.preventDefault();
      if (!validateFields(filterFields)) return;
      L.filters = {};
      for (const f of filterFields) if (f.get()) L.filters[f.spec.name] = f.get();
      L.inactive = inact.checked; L.limit = Number(limitSel.get());
      reload(true);
    });
    inact.addEventListener("change", () => toolbar.requestSubmit());
    limitSel.input.addEventListener("change", () => toolbar.requestSubmit());
    filterFields.forEach((f) => f.input.tagName === "SELECT" && f.input.addEventListener("change", () => toolbar.requestSubmit()));
  })();
  load();
};

/* ---------- Arranque ---------- */
(async function start() {
  const rt = loadRefresh();
  if (rt && API_URL) {
    session.refresh = rt;
    try { await doRefresh(); await loadProfile(); enterApp(); return; }
    catch (_) { endSessionSilently(); }
  }
  renderLogin();
})();
</script>
