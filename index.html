<!doctype html>
<html lang="es-EC">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Backoffice de Vuelos</title>
    <meta name="description" content="Sistema de administración del módulo de vuelos del Booking Prototipo." />
    <meta name="theme-color" content="#1F3864" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1624" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231F3864'/%3E%3Cpath d='M6 19l20-9-6 14-4-5-4 4-1-6z' fill='%23fff'/%3E%3C/svg%3E" />
    <!-- Configuración en tiempo de ejecución (URL de la API): se edita en el sitio publicado, sin recompilar. -->
    <script src="/config.js"></script>
    <script>
      // Aplica el tema antes de pintar para evitar parpadeo (respeta prefers-color-scheme).
      (function () {
        try {
          var stored = localStorage.getItem('backoffice.theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Para usar el backoffice necesitas activar JavaScript en tu navegador.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
